<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Independent reader — AFTERLIGHT</title><link rel="stylesheet" href="afterhours.css"><link rel="stylesheet" href="marketplace.css"></head><body><header class="market-nav"><a class="wordmark" href="index.html">afterlight.</a><nav><a href="collect.html">Collection</a><a href="marketplace.html">Marketplace</a><a href="wallet.html">My works</a></nav></header><main class="utility-page"><h1>The art can<br>outlive this page.</h1><p>This reader fetches raw bytes from the permanent archive, reconstructs the image, and verifies its SHA-256 fingerprint. A working Koinos node is all it needs.</p><label for="rpc">Koinos node</label><input id="rpc" type="url" required><label for="archive">Archive contract</label><input id="archive" required spellcheck="false"><label for="chain">Chain ID</label><input id="chain" required spellcheck="false"><label for="artwork">Artwork</label><input id="artwork" type="number" min="1" max="100" value="1"><button id="read" class="action-button">Read from Koinos</button><p id="status" role="status"></p><img id="image" alt="Recovered AFTERLIGHT artwork" hidden><a id="download" class="underlined" download hidden>Download verified image</a><h2 id="name"></h2><p id="description"></p><pre id="proof"></pre><p><a class="underlined" href="recovery.html" download>Download the standalone reader</a></p></main><script src="chain.js"></script><script>const $=id=>document.getElementById(id);let imageURL;
fetch('network-config.json').then(r=>r.json()).then(c=>{$('rpc').value=c.rpcUrls[0];$('archive').value=c.archiveId||'';$('chain').value=c.chainId;}).catch(()=>{});
$('read').onclick=async()=>{$('read').disabled=true;$('status').textContent='Connecting to Koinos…';$('image').hidden=true;$('download').hidden=true;$('name').textContent='';$('description').textContent='';$('proof').textContent='';try{const id=Number($('artwork').value);if(!Number.isInteger(id)||id<1||id>100)throw Error('Choose artwork 1 through 100.');const result=await AfterlightChain.reconstruct({rpc:$('rpc').value.trim(),contractId:$('archive').value.trim(),chainId:$('chain').value.trim()},id,null,(n,total)=>$('status').textContent='Reading '+n+' / '+total+' chunks');if(!result.mime.startsWith('image/'))throw Error('This is not an image.');if(imageURL)URL.revokeObjectURL(imageURL);imageURL=URL.createObjectURL(new Blob([result.bytes],{type:result.mime}));$('image').src=imageURL;$('image').hidden=false;$('download').href=imageURL;$('download').download='afterlight-'+id+'.webp';$('download').hidden=false;$('name').textContent=result.name;let meta={};try{meta=JSON.parse(result.metadata);}catch{}$('description').textContent=meta.description||'';$('proof').textContent='SHA-256: '+result.sha256+'\nBytes: '+result.bytes.length;$('status').textContent='Verified against the fingerprint stored in the archive.';}catch(e){$('status').textContent=e.message;}finally{$('read').disabled=false;}};</script></body></html>
