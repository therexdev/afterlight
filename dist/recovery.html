<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFTERLIGHT independent reader</title><style>body{max-width:850px;margin:40px auto;padding:20px;font:17px/1.6 Arial;background:#171a19;color:#f1f2eb}label{display:block;margin-top:20px}input{width:100%;box-sizing:border-box;padding:10px;font:inherit}button,a{display:inline-block;margin:20px 0;padding:10px;color:inherit}button{background:#34412d;border:1px solid #9aa48f;cursor:pointer}img{max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none}</style></head><body><h1>The art can<br>outlive this page.</h1><p>This reader fetches raw bytes from the permanent archive, reconstructs the image, and verifies its SHA-256 fingerprint. A working Koinos node is all it needs.</p><label for="rpc">Koinos node</label><input id="rpc" type="url" required><label for="archive">Archive contract</label><input id="archive" required spellcheck="false"><label for="chain">Chain ID</label><input id="chain" required spellcheck="false"><label for="artwork">Artwork</label><input id="artwork" type="number" min="1" max="100" value="1"><button id="read" class="action-button">Read from Koinos</button><p id="status" role="status"></p><img id="image" alt="Recovered AFTERLIGHT artwork" hidden><a id="download" class="underlined" download hidden>Download verified image</a><h2 id="name"></h2><p id="description"></p><pre id="proof"></pre><script>/* Small dependency-free Koinos reader. The independent viewer uses this same code. */
(function(root){
'use strict';
const utf8=new TextEncoder(),text=new TextDecoder();
const hex=b=>Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
const unhex=s=>{if(typeof s!=='string'||!/^([0-9a-f]{2})*$/i.test(s))throw Error('Invalid hex');return Uint8Array.from(s.match(/../g)||[],x=>parseInt(x,16))};
const b64=b=>{let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_')};
const unb64=s=>Uint8Array.from(atob((s||'').replace(/-/g,'+').replace(/_/g,'/')),x=>x.charCodeAt(0));
function varint(n){n=BigInt(n);const o=[];do{let b=Number(n&127n);n>>=7n;if(n)b|=128;o.push(b)}while(n);return o;}
function encode(fields){const o=[];for(const[n,v]of fields){if(v instanceof Uint8Array){o.push(...varint(n*8+2),...varint(v.length),...v)}else o.push(...varint(n*8),...varint(v))}return Uint8Array.from(o);}
function decode(b){let pos=0;const o={};const read=()=>{let n=0n,s=0n;for(let i=0;i<10;i++){if(pos>=b.length)throw Error('Truncated protobuf');const x=b[pos++];n|=BigInt(x&127)<<s;if(!(x&128))return n;s+=7n;}throw Error('Invalid varint')};while(pos<b.length){const tag=Number(read()),field=tag>>>3,wire=tag&7;if(!field)throw Error('Invalid field');if(wire===0)o[field]=read();else if(wire===2){const n=Number(read());if(!Number.isSafeInteger(n)||pos+n>b.length)throw Error('Truncated bytes');o[field]=b.slice(pos,pos+n);pos+=n}else if(wire===1||wire===5){pos+=wire===1?8:4;if(pos>b.length)throw Error('Truncated field')}else throw Error('Unsupported wire type');}return o;}
async function hash(b){return hex(new Uint8Array(await crypto.subtle.digest('SHA-256',b)));}
async function rpc(endpoint,method,params){const url=new URL(endpoint);if(url.protocol!=='https:' && !(url.protocol==='http:'&&['localhost','127.0.0.1'].includes(url.hostname)))throw Error('Use an HTTPS node URL');const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),20000);try{const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:controller.signal});if(!response.ok)throw Error('Node returned HTTP '+response.status);const data=await response.json();if(data.error)throw Error(data.error.message||'Chain request failed');if(!data.result)throw Error('No response from node');return data.result;}finally{clearTimeout(timer)}}
async function read(config,method,fields=[]){const ep=parseInt((await hash(utf8.encode(method))).slice(0,8),16);const r=await rpc(config.rpc,'chain.read_contract',{contract_id:config.contractId,entry_point:ep,args:b64(encode(fields))});return decode(unb64(r.result));}
async function checkNetwork(config){const r=await rpc(config.rpc,'chain.get_chain_id',{});if(r.chain_id!==config.chainId)throw Error('Wrong network. Choose a node for the configured Koinos chain.');return r.chain_id;}
function base58(b){const alphabet='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';let n=0n;for(const v of b)n=n*256n+BigInt(v);let s='';while(n){s=alphabet[Number(n%58n)]+s;n/=58n}for(const v of b){if(v===0)s='1'+s;else break}return s;}
async function reconstruct(config,id,expected,progress=()=>{}){await checkNetwork(config);const raw=await read(config,'get_artifact',[[1,id]]);if(!raw[1])throw Error('This artifact has not been uploaded to the contract yet.');const a=decode(raw[1]);const bytes=Number(a[4]||0n),chunks=Number(a[7]||0n);if(a[9]!==1n)throw Error('The upload is not finalized yet.');if(bytes<1||bytes>200000||chunks!==Math.ceil(bytes/16384))throw Error('Invalid artifact limits');const digest=hex(a[5]||new Uint8Array());if(expected&&expected!==digest)throw Error('The on-chain fingerprint differs from this collection manifest.');const out=new Uint8Array(bytes);for(let i=0;i<chunks;i++){progress(i,chunks);const r=await read(config,'get_chunk',[[1,id],[2,i]]);const part=r[1];if(!(part instanceof Uint8Array)||part.length!==Math.min(16384,bytes-i*16384))throw Error('Invalid image chunk');out.set(part,i*16384)}progress(chunks,chunks);const actual=await hash(out);if(actual!==digest)throw Error('Fingerprint mismatch. The retrieved file failed verification.');const mime=text.decode(a[3]||new Uint8Array());if(!['image/webp','image/png','image/jpeg','text/html'].includes(mime))throw Error('Unsupported artifact type');return{bytes:out,sha256:actual,mime,name:text.decode(a[2]||new Uint8Array()),metadata:text.decode(a[6]||new Uint8Array())};}
root.AfterlightChain={encode,decode,hex,unhex,b64,unb64,hash,rpc,read,checkNetwork,reconstruct,base58};
})(typeof window==='undefined'?globalThis:window);
</script><script>const $=id=>document.getElementById(id);let imageURL;
Promise.resolve({"rpcUrls":["https://api.koinos.io"],"archiveId":null,"chainId":"EiBZK_GGVP0H_fXVAM3j6EAuz3-B-l3ejxRSewi7qIBfSA=="}).then(c=>{$('rpc').value=c.rpcUrls[0];$('archive').value=c.archiveId||'';$('chain').value=c.chainId;}).catch(()=>{});
$('read').onclick=async()=>{$('read').disabled=true;$('status').textContent='Connecting to Koinos…';$('image').hidden=true;$('download').hidden=true;$('name').textContent='';$('description').textContent='';$('proof').textContent='';try{const id=Number($('artwork').value);if(!Number.isInteger(id)||id<1||id>100)throw Error('Choose artwork 1 through 100.');const result=await AfterlightChain.reconstruct({rpc:$('rpc').value.trim(),contractId:$('archive').value.trim(),chainId:$('chain').value.trim()},id,null,(n,total)=>$('status').textContent='Reading '+n+' / '+total+' chunks');if(!result.mime.startsWith('image/'))throw Error('This is not an image.');if(imageURL)URL.revokeObjectURL(imageURL);imageURL=URL.createObjectURL(new Blob([result.bytes],{type:result.mime}));$('image').src=imageURL;$('image').hidden=false;$('download').href=imageURL;$('download').download='afterlight-'+id+'.webp';$('download').hidden=false;$('name').textContent=result.name;let meta={};try{meta=JSON.parse(result.metadata);}catch{}$('description').textContent=meta.description||'';$('proof').textContent='SHA-256: '+result.sha256+'\nBytes: '+result.bytes.length;$('status').textContent='Verified against the fingerprint stored in the archive.';}catch(e){$('status').textContent=e.message;}finally{$('read').disabled=false;}};</script></body></html>
