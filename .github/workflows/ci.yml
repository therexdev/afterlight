name: Build and verify AFTERLIGHT
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:contract
      - run: npm test
      - run: npm run verify:assets
      - run: npm run launch:plan
      - uses: actions/upload-artifact@v4
        with:
          name: afterlight-website-and-contracts
          path: |
            dist/
            contracts/build/*.wasm
            contracts/build/*.abi
            collection/launch-plan.json
          retention-days: 14
